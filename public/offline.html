<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آفلاین — آموزشگاه فیزیک</title>
  <style>
    body {
      font-family: Tahoma, system-ui, sans-serif;
      background: #FBFAF7;
      color: #202A35;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .box { max-width: 22rem; }
    img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 1.2rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .6rem; }
    p { color: #5C6975; line-height: 1.9; margin: 0 0 1.2rem; }
    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: #175A8C;
      border: 0;
      border-radius: 8px;
      padding: .6rem 1.6rem;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #10171F; color: #E6ECF2; }
      p { color: #94A2AF; }
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="آموزشگاه فیزیک">
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>برای استفاده از سامانه به اینترنت نیاز است. پس از برقراری اتصال دوباره تلاش کنید.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
